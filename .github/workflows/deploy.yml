name: Deploy to EC2 (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_KEY_PASSPHRASE }}

          script: |
            set -e

            echo "🚀 Starting deployment..."

            cd ~/coup-game-online

            echo "📥 Syncing code with GitHub (FORCED)..."
            git fetch origin
            git reset --hard origin/dev

            # ======================
            # 🐘 Backend (Laravel)
            # ======================
            echo "🐘 Updating Laravel backend..."
            cd backend

            composer install --no-interaction --prefer-dist --optimize-autoloader

            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear

            echo "🔁 Restarting Laravel service..."
            sudo systemctl restart laravel

            # ======================
            # ⚡ Reverb (WebSockets)
            # ======================
            echo "⚡ Restarting Reverb..."

            cd backend

            # Kill previous Reverb instance (IMPORTANT)
            pkill -f reverb:start || true

            # Start Reverb in background (NOHUP)
            nohup php artisan reverb:start > reverb.log 2>&1 &

            echo "✅ Reverb running in background"

            # ======================
            # ⚛️ Frontend (React - CRA)
            # ======================
            echo "⚛️ Building React frontend..."
            cd ../frontend

            npm install
            npm run build

            echo "📦 Deploying frontend to Nginx..."
            sudo rm -rf /var/www/html/*
            sudo cp -r build/* /var/www/html/

            echo "🔁 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "✅ Deployment finished!"