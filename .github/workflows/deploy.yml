name: Deploy to EC2 (dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Required if EC2_SSH_KEY was created with a passphrase (ssh-keygen -N "...")
          passphrase: ${{ secrets.EC2_SSH_KEY_PASSPHRASE }}
          script: |
            echo "🚀 Starting deployment..."

            cd ~/coup-game-online

            echo "📥 Pull latest code"
            git pull origin dev

            # ======================
            # 🐘 Backend (Laravel)
            # ======================
            echo "🐘 Updating Laravel backend..."
            cd backend

            composer install --no-interaction --prefer-dist --optimize-autoloader

            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear

            echo "🐘 Restarting Laravel server..."
            # Do not use pkill -f "artisan serve": the SSH bash -c '...' cmdline
            # contains that substring, so pkill can kill this script (exit 143).
            if command -v fuser >/dev/null 2>&1; then
              fuser -k 8000/tcp 2>/dev/null || true
            elif command -v lsof >/dev/null 2>&1; then
              PIDS=$(lsof -t -iTCP:8000 -sTCP:LISTEN 2>/dev/null || true)
              if [ -n "$PIDS" ]; then kill $PIDS 2>/dev/null || true; fi
            fi
            sleep 1
            nohup php artisan serve --host=127.0.0.1 --port=8000 > laravel.log 2>&1 &

            # ======================
            # ⚛️ Frontend (React - CRA)
            # ======================
            echo "⚛️ Building React frontend..."
            cd ../frontend

            npm install
            npm run build

            echo "🚀 Deploying frontend to Nginx..."
            sudo rm -rf /var/www/html/*
            sudo cp -r build/* /var/www/html/

            echo "🚀 Reloading Nginx..."
            sudo systemctl reload nginx

            echo "✅ Deployment finished!"